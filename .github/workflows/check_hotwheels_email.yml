name: Hot Wheels Tracker

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit previous.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        SMTP_SERVER: smtp.gmail.com
        SMTP_PORT: 465
      run: python check_hotwheels_email.py

    - name: Commit updated JSON
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add previous.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update previous.json with latest stock" && git push)
